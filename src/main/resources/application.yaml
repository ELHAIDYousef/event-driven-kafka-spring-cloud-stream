spring:
  application:
    name: spring-kafka
  cloud:
    function:
      definition: pageEventConsumer;pageEventSupplier;kStream
    stream:
      bindings:
        pageEventConsumer-in-0:
          destination: T1
        pageEventSupplier-out-0:
          destination: T6
          producer:
            poller:
              fixed-delay: 200
        kStream-in-0:
          destination: T6
        kStream-out-0:
          destination: T7
      kafka:
        streams:
          binder:
            configuration:
              commit.interval.ms: 1000